{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'app_dashboard/img/logo_cveye.png' %}">
    <title>Mot de passe mis à jour - CVEye</title>
    <link rel="stylesheet" href="{% static 'app_dashboard/css/auth.css' %}">
    <script>try{var t=localStorage.getItem("cveye_theme")||"theme-dark";document.documentElement.classList.add(t)}catch(e){}</script>
</head>
<body class="auth-body theme-dark">
    <main class="auth-shell">
        <section class="auth-showcase">
            <p class="auth-eyebrow">Succès</p>
            <h1>Votre mot de passe a été mis à jour.</h1>
            <p class="auth-copy">
                Vous pouvez maintenant vous reconnecter avec votre nouveau mot de passe.
            </p>
        </section>
        <section class="auth-card">
            <div class="auth-card-head">
                <img src="{% static 'app_dashboard/img/logo_cveye.png' %}" alt="CVEye" class="auth-card-logo">
                <p class="auth-eyebrow">Connexion</p>
                <h2>Réinitialisation terminée</h2>
                <p>Le changement a été enregistré avec succès.</p>
            </div>
            <p class="auth-link">
                <a href="{% url 'accounts:login' %}">Retour à la connexion</a>
            </p>
        </section>
    </main>
</body>
</html>
