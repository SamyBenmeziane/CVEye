{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'app_dashboard/img/logo_cveye.png' %}">
    <title>Lien invalide - CVEye</title>
    <link rel="stylesheet" href="{% static 'app_dashboard/css/auth.css' %}">
    <script>try{var t=localStorage.getItem("cveye_theme")||"theme-dark";document.documentElement.classList.add(t)}catch(e){}</script>
</head>
<body class="auth-body theme-dark">
    <main class="auth-shell">
        <section class="auth-showcase">
            <p class="auth-eyebrow">Lien invalide</p>
            <h1>Ce lien n’est plus utilisable.</h1>
            <p class="auth-copy">
                Il a peut-être expiré, déjà été utilisé ou a été copié de manière incomplète.
            </p>
        </section>
        <section class="auth-card">
            <div class="auth-card-head">
                <img src="{% static 'app_dashboard/img/logo_cveye.png' %}" alt="CVEye" class="auth-card-logo">
                <p class="auth-eyebrow">Réessayez</p>
                <h2>Réinitialisation impossible</h2>
                <p>Demandez un nouveau lien de réinitialisation pour continuer.</p>
            </div>
            <p class="auth-link">
                <a href="{% url 'accounts:password_reset' %}">Demander un nouveau lien</a>
            </p>
        </section>
    </main>
</body>
</html>
